<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Móvil - Test Básico</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 20px;
            line-height: 1.6;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        .debug-section {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid #4CAF50;
        }
        .error {
            border-left-color: #f44336;
            background: rgba(244,67,54,0.2);
        }
        .warning {
            border-left-color: #ff9800;
            background: rgba(255,152,0,0.2);
        }
        .success {
            border-left-color: #4CAF50;
            background: rgba(76,175,80,0.2);
        }
        .code {
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9em;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚨 Debug Móvil - Diagnóstico Completo</h1>
        
        <div class="debug-section">
            <h3>📱 Información del Dispositivo</h3>
            <div id="device-info"></div>
        </div>

        <div class="debug-section">
            <h3>🌐 Información del Navegador</h3>
            <div id="browser-info"></div>
        </div>

        <div class="debug-section">
            <h3>📏 Dimensiones de Pantalla</h3>
            <div id="screen-info"></div>
        </div>

        <div class="debug-section">
            <h3>🎨 Test de CSS y Recursos</h3>
            <div id="css-test"></div>
        </div>

        <div class="debug-section">
            <h3>⚡ Test de JavaScript</h3>
            <div id="js-test"></div>
        </div>

        <div class="debug-section">
            <h3>🔗 Conectividad</h3>
            <div id="network-test"></div>
        </div>

        <div class="debug-section">
            <h3>🛠️ Acciones de Debug</h3>
            <button onclick="testMainApp()">Probar App Principal</button>
            <button onclick="clearCache()">Limpiar Cache</button>
            <button onclick="exportResults()">Exportar Resultados</button>
        </div>

        <div class="debug-section">
            <h3>📊 Resultados del Test</h3>
            <div id="results"></div>
        </div>
    </div>

    <script>
        function isMobileDevice() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        }

        function updateDeviceInfo() {
            const deviceInfo = document.getElementById('device-info');
            deviceInfo.innerHTML = `
                <div><strong>User Agent:</strong> ${navigator.userAgent}</div>
                <div><strong>Es Móvil:</strong> ${isMobileDevice() ? '✅ Sí' : '❌ No'}</div>
                <div><strong>Plataforma:</strong> ${navigator.platform}</div>
                <div><strong>Idioma:</strong> ${navigator.language}</div>
                <div><strong>Conexión:</strong> ${navigator.onLine ? '✅ Online' : '❌ Offline'}</div>
            `;
        }

        function updateBrowserInfo() {
            const browserInfo = document.getElementById('browser-info');
            browserInfo.innerHTML = `
                <div><strong>Navegador:</strong> ${navigator.appName}</div>
                <div><strong>Versión:</strong> ${navigator.appVersion}</div>
                <div><strong>Motor:</strong> ${navigator.product}</div>
                <div><strong>Vendor:</strong> ${navigator.vendor}</div>
                <div><strong>Cookies:</strong> ${navigator.cookieEnabled ? '✅ Habilitadas' : '❌ Deshabilitadas'}</div>
            `;
        }

        function updateScreenInfo() {
            const screenInfo = document.getElementById('screen-info');
            screenInfo.innerHTML = `
                <div><strong>Resolución:</strong> ${screen.width}x${screen.height}</div>
                <div><strong>Ventana:</strong> ${window.innerWidth}x${window.innerHeight}</div>
                <div><strong>Viewport:</strong> ${document.documentElement.clientWidth}x${document.documentElement.clientHeight}</div>
                <div><strong>Device Pixel Ratio:</strong> ${window.devicePixelRatio || 1}</div>
                <div><strong>Orientación:</strong> ${screen.orientation ? screen.orientation.type : 'No disponible'}</div>
            `;
        }

        function testCSS() {
            const cssTest = document.getElementById('css-test');
            let results = [];

            // Test CSS básico
            const testDiv = document.createElement('div');
            testDiv.style.width = '100px';
            testDiv.style.height = '100px';
            testDiv.style.backgroundColor = 'red';
            testDiv.style.position = 'absolute';
            testDiv.style.left = '-9999px';
            document.body.appendChild(testDiv);

            const computedStyle = getComputedStyle(testDiv);
            const cssWorking = computedStyle.backgroundColor.includes('rgb(255, 0, 0)') || computedStyle.backgroundColor === 'red';
            
            document.body.removeChild(testDiv);

            results.push(`<div><strong>CSS Básico:</strong> ${cssWorking ? '✅ Funcionando' : '❌ Fallando'}</div>`);

            // Test de carga de hojas de estilo
            const stylesheets = document.styleSheets.length;
            results.push(`<div><strong>Hojas de Estilo:</strong> ${stylesheets} cargadas</div>`);

            // Test específico de la app
            fetch('http://localhost:3001/src/index.css')
                .then(response => {
                    if (response.ok) {
                        results.push(`<div><strong>CSS Principal:</strong> ✅ Accesible</div>`);
                        return response.text();
                    } else {
                        results.push(`<div><strong>CSS Principal:</strong> ❌ Error ${response.status}</div>`);
                        return null;
                    }
                })
                .then(cssText => {
                    if (cssText) {
                        const hasTailwind = cssText.includes('tailwind') || cssText.includes('--tw-');
                        results.push(`<div><strong>Tailwind CSS:</strong> ${hasTailwind ? '✅ Detectado' : '❌ No encontrado'}</div>`);
                    }
                    cssTest.innerHTML = results.join('');
                })
                .catch(error => {
                    results.push(`<div><strong>Error de Red:</strong> ❌ ${error.message}</div>`);
                    cssTest.innerHTML = results.join('');
                });
        }

        function testJS() {
            const jsTest = document.getElementById('js-test');
            let results = [];

            // Test JavaScript básico
            try {
                const testObj = { test: true };
                const jsonTest = JSON.stringify(testObj);
                results.push(`<div><strong>JSON:</strong> ✅ Funcionando</div>`);
            } catch (e) {
                results.push(`<div><strong>JSON:</strong> ❌ Error: ${e.message}</div>`);
            }

            // Test localStorage
            try {
                localStorage.setItem('test', 'value');
                const retrieved = localStorage.getItem('test');
                localStorage.removeItem('test');
                results.push(`<div><strong>LocalStorage:</strong> ${retrieved === 'value' ? '✅ Funcionando' : '❌ Fallando'}</div>`);
            } catch (e) {
                results.push(`<div><strong>LocalStorage:</strong> ❌ Error: ${e.message}</div>`);
            }

            // Test fetch API
            try {
                results.push(`<div><strong>Fetch API:</strong> ${typeof fetch !== 'undefined' ? '✅ Disponible' : '❌ No disponible'}</div>`);
            } catch (e) {
                results.push(`<div><strong>Fetch API:</strong> ❌ Error: ${e.message}</div>`);
            }

            jsTest.innerHTML = results.join('');
        }

        function testNetwork() {
            const networkTest = document.getElementById('network-test');
            let results = [];

            // Test de conectividad a la app principal
            fetch('http://localhost:3001/')
                .then(response => {
                    if (response.ok) {
                        results.push(`<div><strong>App Principal:</strong> ✅ Accesible (${response.status})</div>`);
                        return response.text();
                    } else {
                        results.push(`<div><strong>App Principal:</strong> ❌ Error ${response.status}</div>`);
                        return null;
                    }
                })
                .then(html => {
                    if (html) {
                        const hasReact = html.includes('react') || html.includes('React');
                        const hasRoot = html.includes('id="root"');
                        results.push(`<div><strong>HTML React:</strong> ${hasRoot ? '✅ Root encontrado' : '❌ Root no encontrado'}</div>`);
                    }
                    networkTest.innerHTML = results.join('');
                })
                .catch(error => {
                    results.push(`<div><strong>Error de Conexión:</strong> ❌ ${error.message}</div>`);
                    networkTest.innerHTML = results.join('');
                });
        }

        function testMainApp() {
            window.open('http://localhost:3001/', '_blank');
        }

        function clearCache() {
            if ('caches' in window) {
                caches.keys().then(cacheNames => {
                    cacheNames.forEach(cacheName => {
                        caches.delete(cacheName);
                    });
                });
            }
            
            // Limpiar localStorage
            localStorage.clear();
            sessionStorage.clear();
            
            alert('Cache limpiado. Recarga la página principal.');
        }

        function exportResults() {
            const results = {
                timestamp: new Date().toISOString(),
                userAgent: navigator.userAgent,
                isMobile: isMobileDevice(),
                screen: `${screen.width}x${screen.height}`,
                window: `${window.innerWidth}x${window.innerHeight}`,
                online: navigator.onLine,
                platform: navigator.platform,
                language: navigator.language,
                stylesheets: document.styleSheets.length
            };
            
            const blob = new Blob([JSON.stringify(results, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'mobile-debug-results.json';
            a.click();
        }

        // Ejecutar todos los tests al cargar
        window.addEventListener('load', () => {
            updateDeviceInfo();
            updateBrowserInfo();
            updateScreenInfo();
            testCSS();
            testJS();
            testNetwork();
        });

        // Actualizar info de pantalla al cambiar orientación
        window.addEventListener('resize', updateScreenInfo);
        window.addEventListener('orientationchange', updateScreenInfo);
    </script>
</body>
</html>
